<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WTI HR Attendance System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      min-height: 100vh;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
      transform: translateY(-2px);
    }
    .btn-primary:active { transform: translateY(1px); }
    .btn-action {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }
    .btn-action:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }
    .input-field {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      transition: all 0.3s ease;
    }
    .input-field:focus {
      outline: none;
      border-color: #a855f7;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      border-top: 3px solid #fff;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .fade-enter { animation: fadeIn 0.4s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-6">

  <div id="toast" class="fixed top-5 right-5 z-50 transform transition-all duration-300 opacity-0 translate-y-[-20px] pointer-events-none">
    <div id="toastContent" class="px-6 py-3 rounded-lg shadow-lg text-white font-medium"></div>
  </div>

  <div id="loginScreen" class="glass-panel rounded-2xl p-8 w-full max-w-md fade-enter flex flex-col items-center justify-center">
    <div class="inline-block p-3 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 mb-4 shadow-lg">
      <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path></svg>
    </div>
    <h1 class="text-2xl font-bold tracking-tight text-white mb-4">WTI Portal</h1>
    <div class="spinner border-indigo-500 border-t-transparent w-8 h-8 mb-4"></div>
    <p class="text-slate-400 text-sm text-center">Authenticating via Telegram...</p>
  </div>

  <div id="dashboardScreen" class="w-full max-w-4xl hidden fade-enter">
    <div class="glass-panel rounded-2xl p-6 sm:p-8 mb-6 relative">
      <div class="absolute top-4 right-6 text-xs font-medium text-slate-500 tracking-wider">
        Developed by <span class="text-indigo-400/80">Chhay Hun Pol</span>
      </div>
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pt-4 sm:pt-2">
        <div>
          <h2 class="text-2xl font-bold text-white mb-1">Welcome back, <span id="dashName" class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-400">User</span></h2>
          <p class="text-slate-400 text-sm"><span id="dashPosition">Position</span> • <span id="dashDept">Department</span></p>
        </div>
        <div class="text-right flex gap-4 bg-white/5 rounded-xl p-4 border border-white/10 mt-2 sm:mt-0">
          <div>
            <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Yearly Balance</p>
            <p class="text-2xl font-bold text-white"><span id="dashYearlyBal">0</span> <span class="text-sm font-normal text-slate-400">days</span></p>
          </div>
          <div class="w-px bg-white/10"></div>
          <div>
            <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Monthly Balance</p>
            <p class="text-2xl font-bold text-white"><span id="dashMonthlyBal">0</span> <span class="text-sm font-normal text-slate-400">days</span></p>
          </div>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="glass-panel rounded-2xl p-6 sm:p-8 flex flex-col">
        <div class="flex items-center gap-3 mb-6">
          <div class="p-2 bg-indigo-500/20 rounded-lg text-indigo-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </div>
          <h3 class="text-xl font-semibold text-white">Live Attendance</h3>
        </div>
        <p class="text-sm text-slate-400 mb-6 leading-relaxed">Geofence validation is active. Ensure you are within 50m of your base coordinates.</p>
        <div class="grid grid-cols-2 gap-4 mt-auto">
          <button onclick="handleAttendance('Morning In', this)" class="btn-action rounded-xl p-4 flex flex-col items-center gap-2 group">
            <span class="text-lg">🌅</span>
            <span class="text-sm font-medium text-slate-300 group-hover:text-white transition">Morning In</span>
          </button>
          <button onclick="handleAttendance('Lunch Out', this)" class="btn-action rounded-xl p-4 flex flex-col items-center gap-2 group">
            <span class="text-lg">🍔</span>
            <span class="text-sm font-medium text-slate-300 group-hover:text-white transition">Lunch Out</span>
          </button>
          <button onclick="handleAttendance('Afternoon In', this)" class="btn-action rounded-xl p-4 flex flex-col items-center gap-2 group">
            <span class="text-lg">☀️</span>
            <span class="text-sm font-medium text-slate-300 group-hover:text-white transition">Afternoon In</span>
          </button>
          <button onclick="handleAttendance('Evening Out', this)" class="btn-action rounded-xl p-4 flex flex-col items-center gap-2 group">
            <span class="text-lg">🌙</span>
            <span class="text-sm font-medium text-slate-300 group-hover:text-white transition">Evening Out</span>
          </button>
        </div>
      </div>

      <div class="glass-panel rounded-2xl p-6 sm:p-8">
        <div class="flex items-center gap-3 mb-6">
          <div class="p-2 bg-purple-500/20 rounded-lg text-purple-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          </div>
          <h3 class="text-xl font-semibold text-white">Request Leave</h3>
        </div>

        <form id="leaveForm" onsubmit="handleLeaveSubmit(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Leave Type</label>
            <select id="leaveType" required class="input-field w-full rounded-lg px-3 py-2 text-sm" onchange="toggleLeaveFields()">
              <option value="" disabled selected>Select Type</option>
              <option value="Annual">Annual Leave</option>
              <option value="Sick">Sick Leave</option>
              <option value="Maternity">Maternity Leave</option>
              <option value="Special">Special</option>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Start Date</label>
              <input type="date" id="startDate" required onchange="autofillMaternityEnd()" class="input-field w-full rounded-lg px-3 py-2 text-sm [color-scheme:dark]">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Start Time (Opt)</label>
              <input type="time" id="startTime" class="input-field w-full rounded-lg px-3 py-2 text-sm [color-scheme:dark]">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">End Date</label>
              <input type="date" id="endDate" required class="input-field w-full rounded-lg px-3 py-2 text-sm [color-scheme:dark]">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">End Time (Opt)</label>
              <input type="time" id="endTime" class="input-field w-full rounded-lg px-3 py-2 text-sm [color-scheme:dark]">
            </div>
          </div>

          <div id="sickLeaveAttachment" class="hidden fade-enter">
            <label class="block text-xs font-medium text-slate-400 mb-1">Medical Certificate (Optional)</label>
            <input type="file" id="medicalCert" accept="image/*,.pdf" class="input-field w-full rounded-lg px-3 py-2 text-sm text-slate-300 file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:bg-white/10 file:text-white hover:file:bg-white/20 transition">
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Reason</label>
            <textarea id="leaveReason" required rows="2" class="input-field w-full rounded-lg px-3 py-2 text-sm resize-none"></textarea>
          </div>

          <button type="submit" id="submitLeaveBtn" class="btn-primary w-full rounded-xl py-3 mt-2 font-medium text-white text-sm flex justify-center items-center gap-2">
            <span>Submit Request</span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ REQUIRED: set this to your Apps Script /exec URL (the API_BASE_URL / WEB_APP_URL
    // value in Config.gs). This launcher talks to it purely via fetch() as a JSON API.
    const API_BASE_URL = "https://script.google.com/macros/s/AKfycbyRlJl7lFbG_qpBuMPSWj1pNDk8NpSfgRQ7DVGjxqRgB2Y5DGnj0lQAopuiHkr6mgT-pQ/exec";

    let currentEmployee = null;
    let currentInitData = null;

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const content = document.getElementById('toastContent');
      content.textContent = message;
      content.className = type === 'success'
        ? 'px-6 py-3 rounded-lg shadow-lg text-white font-medium bg-emerald-500/90 backdrop-blur border border-emerald-400/50'
        : 'px-6 py-3 rounded-lg shadow-lg text-white font-medium bg-red-500/90 backdrop-blur border border-red-400/50';
      toast.classList.remove('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
      }, 4000);
    }

    // Talks to the Apps Script backend as a plain JSON API.
    // Uses text/plain content-type deliberately — this avoids a CORS
    // preflight (OPTIONS) request, which Apps Script Web Apps don't handle.
    async function callApi(action, extraPayload) {
      const body = Object.assign({ action, initData: currentInitData }, extraPayload || {});
      const res = await fetch(API_BASE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      });
      const text = await res.text();
      return JSON.parse(text);
    }

    // --- Init & Authentication ---
    document.addEventListener("DOMContentLoaded", () => {
      const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      if (tg) tg.ready();

      let attempts = 0;
      const maxAttempts = 20; // ~2 seconds total

      function tryGetInitData() {
        const initData = tg && tg.initData ? tg.initData : "";
        if (initData) {
          currentInitData = initData;
          authenticateUser();
          return;
        }
        attempts++;
        if (attempts < maxAttempts) {
          setTimeout(tryGetInitData, 100);
          return;
        }
        showToast("Error: Unauthorized access.", "error");
        document.querySelector('#loginScreen p').textContent = "Please open this from the Telegram bot's Launch HR Dashboard button.";
        const spinner = document.querySelector('#loginScreen .spinner');
        if (spinner) spinner.style.display = 'none';
      }

      tryGetInitData();
    });

    async function authenticateUser() {
      try {
        const res = await callApi('authenticate', {});
        if (res.success) {
          currentEmployee = res.data;
          loadDashboard();
        } else {
          showToast(res.error || 'Authentication failed', 'error');
          document.querySelector('#loginScreen p').textContent = "Access Denied.";
          const spinner = document.querySelector('#loginScreen .spinner');
          if (spinner) spinner.style.display = 'none';
        }
      } catch (err) {
        showToast('Network error', 'error');
      }
    }

    function loadDashboard() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('dashboardScreen').classList.remove('hidden');
      document.getElementById('dashName').textContent = currentEmployee.name.split(' ')[0];
      document.getElementById('dashPosition').textContent = currentEmployee.position;
      document.getElementById('dashDept').textContent = currentEmployee.department;
      document.getElementById('dashYearlyBal').textContent = currentEmployee.yearlyBalance.toFixed(1);
      document.getElementById('dashMonthlyBal').textContent = currentEmployee.monthlyBalance.toFixed(1);
    }

    // --- Leave Logic ---
    function toggleLeaveFields() {
      const type = document.getElementById('leaveType').value;
      const sickDiv = document.getElementById('sickLeaveAttachment');
      if (type === 'Sick') {
        sickDiv.classList.remove('hidden');
      } else {
        sickDiv.classList.add('hidden');
        document.getElementById('medicalCert').value = "";
      }
      autofillMaternityEnd();
    }

    // Maternity is a fixed 90-day entitlement counted in WORKING days, which
    // needs the holiday list — so the date is computed server-side. The field
    // stays editable for staff returning early.
    async function autofillMaternityEnd() {
      const type = document.getElementById('leaveType').value;
      const startVal = document.getElementById('startDate').value;
      const endField = document.getElementById('endDate');

      if (type !== 'Maternity' || !startVal) return;

      const originalPlaceholder = endField.value;
      try {
        const res = await callApi('maternityEnd', { startDate: startVal });
        if (res.success && res.endDate) {
          endField.value = res.endDate;
          showToast(`End date set to ${res.quota} working days. You can shorten it if returning early.`, 'success');
        }
      } catch (err) {
        endField.value = originalPlaceholder;
        showToast('Could not auto-calculate the end date — please set it manually.', 'error');
      }
    }

    function handleLeaveSubmit(e) {
      e.preventDefault();
      const type = document.getElementById('leaveType').value;
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;

      if (type === 'Maternity') {
        const sDate = new Date(start);
        const eDate = new Date(end);
        const diffDays = Math.ceil(Math.abs(eDate - sDate) / (1000 * 60 * 60 * 24)) + 1;
        if (diffDays > 90) {
          showToast(`Maternity leave cannot exceed 90 days. Selected: ${diffDays} days.`, 'error');
          return;
        }
      }

      const formData = {
        leaveType: type,
        startDate: start,
        startTime: document.getElementById('startTime').value,
        endDate: end,
        endTime: document.getElementById('endTime').value,
        reason: document.getElementById('leaveReason').value,
        attachmentUrl: ""
      };
      // Note: empId/name are NOT sent — the backend derives them from the
      // verified Telegram identity, so a request can never be spoofed as
      // someone else even though this page is hosted outside Apps Script.

      const btn = document.getElementById('submitLeaveBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<div class="spinner"></div> <span>Submitting...</span>';
      btn.disabled = true;

      callApi('submitLeave', { formData })
        .then((res) => {
          btn.innerHTML = originalText;
          btn.disabled = false;
          if (res.success) {
            showToast('Leave request submitted! ID: ' + res.leaveId, 'success');
            document.getElementById('leaveForm').reset();
            toggleLeaveFields();
          } else {
            showToast(res.error, 'error');
          }
        })
        .catch(() => {
          btn.innerHTML = originalText;
          btn.disabled = false;
          showToast('Failed to submit request', 'error');
        });
    }

    // --- Attendance & Geolocation ---
    function handleAttendance(action, btnElement) {
      if (!currentEmployee) return;
      const originalHtml = btnElement.innerHTML;
      btnElement.innerHTML = '<div class="spinner border-indigo-500 border-t-transparent w-6 h-6"></div>';
      btnElement.disabled = true;

      if (!navigator.geolocation) {
        btnElement.innerHTML = originalHtml;
        btnElement.disabled = false;
        showToast('Geolocation is not supported by your browser', 'error');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const scanData = {
            action: action,
            latitude: position.coords.latitude,
            longitude: position.coords.longitude
          };
          // Note: empId/name are NOT sent — derived server-side from verified identity.

          callApi('logAttendance', { scanData })
            .then((res) => {
              btnElement.innerHTML = originalHtml;
              btnElement.disabled = false;
              if (res.success) {
                showToast(res.message, 'success');
              } else {
                showToast(res.error, 'error');
              }
            })
            .catch(() => {
              btnElement.innerHTML = originalHtml;
              btnElement.disabled = false;
              showToast('Server communication error', 'error');
            });
        },
        (error) => {
          btnElement.innerHTML = originalHtml;
          btnElement.disabled = false;
          let errMsg = 'Location access denied or unavailable.';
          if (error.code === 1) errMsg = 'Please allow location permissions to clock in.';
          else if (error.code === 2) errMsg = 'Position unavailable. Check your GPS signal.';
          else if (error.code === 3) errMsg = 'Location request timed out.';
          showToast(errMsg, 'error');
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }
  </script>
</body>
</html>
